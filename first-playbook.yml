---
- name: My First Ansible Playbook
  hosts: all
  become: yes
  tasks:
    - name: httpd is installed
      yum:
        name: httpd
        state: present
    - name: httpd is started and enabled
      service:
        name: httpd
        state: started
        enabled: yes
    - name: Copy index.html to web server
      copy:
        src: /var/www/html/index.html
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'       